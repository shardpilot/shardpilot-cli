name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: gitleaks
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","Linux","X64"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is LOAD-BEARING, not tidiness. The scan below reads git
      # HISTORY, and on a shallow clone it reads only the commits that were
      # fetched — reporting "no leaks found" for a repository whose history was
      # never opened. That is the exact vacuous pass this job exists to avoid,
      # and it is invisible in the log: a truncated scan and a clean one print
      # the same line.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Fetch pull-request refs for the history scan
        run: git fetch origin '+refs/pull/*/head:refs/remotes/origin/pr/*'

      # `git`, not `dir`. A working-tree scan is BLIND to a secret that was
      # committed and later deleted — demonstrated on 2026-08-16 by planting one
      # and removing it: the dir scan went clean while the history scan found it.
      # A repository flip publishes every commit, not the current tree, so the
      # history scan is the one that matches what publication actually exposes.
      #
      # The three GIT_CONFIG_* variables declare /repo a safe directory INSIDE
      # the container. They are inert today — the container runs as root, the
      # bind mount is owned by the runner UID, and the scan completes: the
      # 2026-08-17 run reports "12 commits scanned … no leaks found". They are
      # here because that is a property of the current image's default user, and
      # if a future tag ever runs as non-root, git's ownership check refuses the
      # repository and gitleaks exits BEFORE scanning anything. That failure is
      # loud (the job goes red) rather than a false clean, so this is insurance
      # against a blocked pipeline, not against a silent pass.
      #
      # ⚠ Untested, because it cannot be reached from the state that exists: the
      # condition it guards does not occur today, so there is no way to observe
      # it working. Recorded as such rather than described as verified.
      - name: Scan git history for secrets
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo" \
            --workdir /repo \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --log-opts="--all" --redact --verbose --no-banner /repo

  go:
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","Linux","X64"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # ⚠ READ FROM go.mod, NOT WRITTEN AGAIN. This job installed 1.26.5
          # while the other installed 1.27.0 and `make ci` rejects any
          # formatter that is not the version go.mod names — so every
          # tag-triggered release died in its own test step before building
          # anything, and the two workflows could drift again the moment one
          # was edited alone.
          go-version-file: go.mod
          cache: false

      # `make ci`, not a re-implementation of it. The four steps that used to
      # live here (an inline gofmt loop, test, vet, build) drifted from the
      # Makefile the moment the Makefile grew a check they did not call — and a
      # gate CI never executes is a gate that is not there. Running the same
      # entry point a developer runs is what keeps the two from diverging again.
      #
      # The inline check it replaces was also weaker than the target, in the
      # exact way the target exists to prevent. It interpolated `git ls-files`
      # unquoted, so the shell re-read every path as words and globs. Measured
      # on 2026-08-21: with a tracked, UNFORMATTED `a[b].go` beside a formatted
      # `ab.go`, the glob expanded to `ab.go` and the step exited 0 — a clean
      # report on a tree it never looked at. A path holding a space fails the
      # other way, with `stat my: no such file or directory`. It also handed
      # gofmt every tracked *.go file, including the vendored and testdata trees
      # the Go tool itself ignores.
      - name: Workflow runner policy
        run: |
          python3 -m venv "$RUNNER_TEMP/workflow-policy"
          "$RUNNER_TEMP/workflow-policy/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/workflow-policy/bin/python" scripts/check-workflow-runners.py
      - name: Set analysis output
        if: always()
        run: echo "STATIC_CHECK_OUTPUT=$RUNNER_TEMP/go-static-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: CI
        run: |
          make fmt
          git diff --exit-code
          make ci

      - name: Checksum verification fixtures
        run: python3 scripts/test-release-checksums.py

      # The RELEASE PACKAGING PATH, on every pull request — not only at
      # release time. Cross-compiles all six targets, writes checksums, and
      # asserts that every platform in the matrix produced a non-empty
      # binary, one checksum per platform, and matching archive digests.
      #
      # Everything a tag build does except the two irreversible steps
      # (creating the tag, creating the Release). A release procedure that
      # runs for the first time when it matters is a procedure nobody has
      # tested.
      - name: Release packaging dry run
        run: make release-dryrun

      - name: Check explicit release version stamping
        run: |
          ./dist/shardpilot_linux_amd64 version
          make build VERSION=v0.4.1
          actual="$(./bin/shardpilot version)"
          printf '%s\n' "$actual"
          test "$actual" = 'shardpilot v0.4.1'

      - name: Report NilAway
        if: always() && hashFiles('scripts/go_static_checks.py') != ''
        continue-on-error: true
        run: make nilaway-report

      - name: Preserve analysis status
        if: always() && hashFiles('scripts/go_static_checks.py') != ''
        continue-on-error: true
        run: |
          mkdir -p "$STATIC_CHECK_OUTPUT"
          if [ ! -f "$STATIC_CHECK_OUTPUT/nilaway-status.json" ]; then
            echo '{"analysis":"error","diagnostics":null,"error":"NilAway report step did not produce status"}' > "$STATIC_CHECK_OUTPUT/nilaway-status.json"
          fi

      - name: Upload static-analysis reports
        if: always() && hashFiles('scripts/go_static_checks.py') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.STATIC_CHECK_OUTPUT }}/**/*
            !${{ env.STATIC_CHECK_OUTPUT }}/**/bin/**
          retention-days: 7
